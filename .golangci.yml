version: "2"

run:
  concurrency: 8
  timeout: 5m
  build-tags:
    - integration

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gochecknoinits
    - gocritic
    - gocyclo
    - goconst
    - gosec
    - govet
    - ineffassign
    - makezero
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: net/http
              desc: "домен не знает про транспорт"
            - pkg: github.com/go-chi/chi
              desc: "домен не знает про роутер"
            - pkg: github.com/jackc/pgx
              desc: "домен не знает про базу"
            - pkg: github.com/Masterminds/squirrel
              desc: "домен не строит SQL"
            - pkg: go.opentelemetry.io/otel
              desc: "домен не знает про телеметрию"
            - pkg: github.com/nedarixxx/template/api
              desc: "домен не знает про api"
            - pkg: github.com/nedarixxx/template/internal/usecase
              desc: "домен не может зависеть от сценариев"
            - pkg: github.com/nedarixxx/template/internal/infra
              desc: "домен не может зависеть от инфраструктуры"
            - pkg: github.com/nedarixxx/template/internal/repository
              desc: "домен не может зависеть от репозиториев"
            - pkg: github.com/nedarixxx/template/internal/http
              desc: "домен не может зависеть от HTTP-слоя"
        usecase:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: net/http
              desc: "usecase не знает про транспорт"
            - pkg: github.com/go-chi/chi
              desc: "usecase не знает про роутер"
            - pkg: github.com/jackc/pgx
              desc: "usecase работает через интерфейс, а не через драйвер бд"
            - pkg: github.com/Masterminds/squirrel
              desc: "usecase не строит SQL"
            - pkg: github.com/nedarixxx/template/api
              desc: "usecase не знает про api"
            - pkg: github.com/nedarixxx/template/internal/infra
              desc: "usecase не может напрямую зависеть от инфраструктуры"
            - pkg: github.com/nedarixxx/template/internal/http
              desc: "usecase не может зависеть от транспортного слоя"
        http:
          files:
            - "**/internal/http/**"
          deny:
            - pkg: github.com/nedarixxx/template/internal/repository
              desc: "http не может зависеть от репозиториев"
            - pkg: github.com/nedarixxx/template/internal/infra
              desc: "http не может зависеть от инфраструктуры"

    forbidigo:
      forbid:
        - pattern: ^[A-Za-z0-9]{1,}_.*\.

    revive:
      rules:
        - name: var-naming
          disabled: true

    unparam:
      check-exported: true

    unused:
      field-writes-are-uses: false

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - api/
      - gen/

formatters:
  enable:
    - gofumpt
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra-rules: true

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
