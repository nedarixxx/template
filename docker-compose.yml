services:
  postgres:
    image: postgres:16-alpine
    container_name: trip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripgo
      POSTGRES_PASSWORD: tripgo
      POSTGRES_DB: tripgo
    ports:
      - "22032:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgo -d tripgo"]
      interval: 3s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: trip-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "22686:16686" # Jaeger Web UI
      - "22317:4317"  # OTLP gRPC receiver

  trip-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://tripgo:tripgo@postgres:5432/tripgo?sslmode=disable"
      HTTP_ADDR: ":8080"
      LOG_LEVEL: "debug"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"

volumes:
  pg_data:
